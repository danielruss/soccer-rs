[package]
name = "soccer-rs"
version = "0.2.0-rc.1"
edition = "2024"
authors = ["Daniel Russ <druss@mail.nih.gov>"]
description = "Occupation and industry coding for epidemiologic studies and more"
license = "MIT" 
repository = "https://github.com/danielruss/soccer-rs"

[dependencies]
bytes = "1.11.1"
csv = "1.4.0"
dirs = "6.0.0"
itertools = "0.14.0"
ndarray = "0.17.2"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider"] }
ort-candle = { version = "=0.3.0", optional = true }
## ort is a wrapper around the C++ library and it is not available for some combination of platforms
## for platforms without pre-compiled binaries use ort-candle, an all-Rust ONNX runtime.

## Use ORT Wrapper:
[target.'cfg(not(any(all(target_os = "windows", target_env = "gnu"),all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std", "ndarray", "tracing", "api-21",
    "download-binaries", "tls-rustls", "copy-dylibs",
] }

## Use Candle
# Candle fallback — windows-gnu (R/Rtools) and x86_64-apple-darwin (Intel Mac)
[target.'cfg(any(all(target_os = "windows", target_env = "gnu"),all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std", "ndarray", "tracing", "api-21", "alternative-backend",
] }
ort-candle = { version = "=0.3.0" }
libloading = "0.9.0"


[features]
force-candle = ["dep:ort-candle", "ort/alternative-backend"]
coreml = ["ort/coreml"]
