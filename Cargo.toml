[package]
name = "soccer-rs"
version = "0.1.10-ortfix.3"
edition = "2024"
authors = ["Daniel Russ <druss@mail.nih.gov>"]
description = "Occupation and industry coding for epidemiologic studies and more"
license = "MIT" 
repository = "https://github.com/danielruss/soccer-rs"

[dependencies]
bytes = "1.11.1"
csv = "1.4.0"
dirs = "6.0.0"
itertools = "0.14.0"
ndarray = "0.17.2"
once_cell = "1.21.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-24",],}

[target.'cfg(all(windows, target_env = "gnu"))'.dependencies]
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "tls-rustls", "api-24"] }
