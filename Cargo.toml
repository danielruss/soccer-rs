[package]
name = "soccer-rs"
version = "0.1.5"
edition = "2024"
authors = ["Daniel Russ <druss@mail.nih.gov>"]
description = "Occupation and industry coding for epidemiologic studies and more"
license = "MIT" 
repository = "https://github.com/danielruss/soccer-rs"

[dependencies]
bytes = "1.11.1"
csv = "1.4.0"
dirs = "6.0.0"
itertools = "0.14.0"
ndarray = "0.17.2"
once_cell = "1.21.4"
ort = "2.0.0-rc.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokenizers = "0.22.2"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }

